version: "3.9"
services:
  sqlite:
    image: alpine/sqlite:3.46 # or keva/core for web UI; using CLI here
    container_name: if_sqlite
    volumes:
      - ./db:/data
    environment:
      - SQLITE_DB=/data/intermittent.db
    ports:
      - "8080:8080"  # placeholder if using sqlite-web; CLI only for adapter tests
    command: ["/bin/sh","-c","mkdir -p /data; sqlite3 /data/intermittent.db 'CREATE TABLE IF NOT EXISTS fast_records(id PRIMARY KEY,startTime,endTime,durationMs,completed,pattern,createdAt);'"]
