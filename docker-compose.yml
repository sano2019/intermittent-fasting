version: "3.9"
services:
  sqlite:
    image: alpine:3.19
    container_name: if_sqlite
    volumes:
      - ./db:/data
    command: ["/bin/sh","-c","apk add --no-cache sqlite; mkdir -p /data; sqlite3 /data/intermittent.db 'CREATE TABLE IF NOT EXISTS fast_records (id TEXT PRIMARY KEY, startTime TEXT, endTime TEXT, durationMs INTEGER, completed INTEGER, pattern TEXT, createdAt TEXT); SELECT 1;'"]
    ports: []
