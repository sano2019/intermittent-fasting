<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f8f6f2;--card:#fff;--fg:#222;--muted:#6e6c60;--accent:#7fbf7f;--amber:#c7bfae;--border:#eae8e0;}
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:32px;display:flex;flex-direction:column;align-items:center;gap:28px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:1.25rem;padding:28px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.03);}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-style:italic;font-size:1.7rem;margin-bottom:16px;}
.info{font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:18px;}
.info b{color:var(--amber);font-weight:400;}
.input-row{display:flex;align-items:center;gap:10px;}
input[type=number]{flex:1;padding:10px 12px;border-radius:.75rem;border:1px solid var(--border);font:inherit;font-size:1rem;background:#fff;color:#222;}
input:focus{outline:2px solid var(--amber);outline-offset:1px;}
.sum{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.5rem;color:var(--accent);}
.note{font-size:.78rem;color:var(--muted);margin-top:12px;}
</style></head>
<body>
<div class="card">
  <h2>5:2 · Calorie Day</h2>
  <div class="info">Suggested: <b>600 cal</b> (men) · <b>500 cal</b> (women) · two light days per week.</div>
  <div class="input-row">
    <label style="font-size:.78rem;color:#6e6c60;">Cal intake:</label>
    <input type="number" value="0" min="0" placeholder="kcal" aria-label="Calorie input">
  </div>
  <div style="margin-top:14px;font-size:.82rem;color:#6e6c60;">Total: <span class="sum">0</span> kcal · <span style="color:#c7bfae;">light day</span></div>
  <div class="note">No timer for 5:2 — record each light-day's intake. Save updates profile history.</div>
</div>
</body></html>
