<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Serif:ital,wght@1,300;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500&display=swap');
:root{
  --bg:#f6f3ea; --card:#fffdf8; --ink:#232220; --muted:#6e6c60;
  --amber:#c7bfae; --green:#7fbf7f; --line:#eae8e0;
  --font-display:'Cormorant Serif',Georgia,serif; --font-body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.container{max-width:720px;width:100%}
h1{font-family:var(--font-display);font-weight:600;font-size:2.6rem;line-height:1.1;letter-spacing:-0.03em;margin-bottom:8px}
h1 em{font-style:italic;font-weight:300;color:var(--muted);display:block;font-size:0.75em;margin-top:4px}
.subtitle{color:var(--muted);font-size:0.97rem;margin-bottom:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.25rem;padding:32px 32px 36px 32px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.profile-choice{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:32px}
.profile-choice button{font-family:var(--font-body);font-size:0.88rem;padding:16px 8px;border-radius:0.75rem;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:all .15s ease;line-height:1.25;text-align:center}
.profile-choice button.active{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:500}
.profile-choice button .pill{display:block;font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin-bottom:2px}
.preview-label{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:1.05rem;color:var(--muted);margin-bottom:24px}

/* OMAD visualization */
.omad-block{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.omad-clock{width:160px;height:160px;border-radius:50%;border:6px solid var(--line);background:#fffdf8;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 2px 12px rgba(0,0,0,.03)}
.omad-clock::before{content:'';position:absolute;width:12px;height:12px;background:var(--green);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(127,191,127,.25)}
.omad-clock .time{font-family:var(--font-display);font-size:2.6rem;font-weight:300;letter-spacing:-0.04em;line-height:1}
.omad-clock .label{font-size:0.7rem;color:var(--muted);margin-top:2px;text-align:center;letter-spacing:0.04em}
.omad-info{max-width:340px;font-size:0.92rem;color:var(--ink);line-height:1.6}
.omad-info h3{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:1.1rem;margin-bottom:6px}
.omad-info p{margin-bottom:8px}

/* Cal input (5:2 preview) */
.cal-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.cal-row input[type=number]{width:110px;padding:10px 10px;border:1.5px solid var(--line);border-radius:0.75rem;font-family:var(--font-display);font-size:1.4rem;background:#fff;color:var(--ink);text-align:center;outline:none;transition:border-color .15s}
.cal-row input:focus{border-color:var(--amber)}
.cal-row .cal-pill{padding:6px 12px;border-radius:0.75rem;background:var(--amber);color:#fff;font-family:var(--font-display);font-size:1.1rem;font-weight:600;min-width:90px;text-align:center}
.info-box{margin-top:28px;padding:16px 18px;background:#f4f0e6;border:1px solid #e6dfce;border-radius:0.75rem;font-size:0.82rem;color:var(--muted);line-height:1.55}
.info-box strong{color:var(--ink);font-weight:500}

footer{margin-top:32px;text-align:center;color:#b8b5a8;font-size:0.78rem;letter-spacing:0.02em}
</style>
</head>
<body>
<div class="container">
  <h1>OMAD profile choice<em>one meal, one window — 24h timer, single record</em></h1>
  <p class="subtitle">Profile: Custom · 16:8 · OMAD · 5:2 — Custom selected first (current hour-selector). Visualization for OMAD.</p>

  <div class="card">
    <div class="profile-choice" aria-label="Profile choice">
      <button onclick="pick('Custom')" id="btn-Custom"><span class="pill">Custom</span>hour picker · first-run default</button>
      <button onclick="pick('16:8')" id="btn-16:8"><span class="pill">16:8</span>16h fixed · hidden buttons/text</button>
      <button onclick="pick('OMAD')" id="btn-OMAD" class="active"><span class="pill">OMAD</span>24h · single record</button>
      <button onclick="pick('5:2')" id="btn-5:2"><span class="pill">5:2</span>calorie only · no timer</button>
    </div>

    <div id="preview"></div>
  </div>

  <footer>/frontend-design visualization — OMAD · not a document · for logic check only</footer>
</div>

<script>
function pick(name){
  ['Custom','16:8','OMAD','5:2'].forEach(n=>document.getElementById('btn-'+n).classList.remove('active'));
  document.getElementById('btn-'+name).classList.add('active');
  render(name);
}
function render(name){
  const p=document.getElementById('preview');
  if(name==='OMAD'){
    p.innerHTML=`
      <div class="preview-label">Profile: OMAD &mdash; one 24-hour fast, one meal per day</div>
      <div class="omad-block">
        <div class="omad-clock"><div><div class="time">24h</div><div class="label">one window · one meal</div></div></div>
        <div class="omad-info">
          <h3>How the user records the meal</h3>
          <p><strong>Single start/stop pair.</strong> The user presses <em>Start fast</em> when they begin the 24-hour window; presses <em>Stop</em> when they eat their single meal. That logs one entry in history.</p>
          <p>No hourly buttons. No between-text. The clock shows <strong>24h</strong> (fixed, not selectable). A partial-state pill: green when full 24h met, amber if shorter, gray if zero.</p>
          <p><strong>Tips (open input):</strong> should we show a simple "I ate at 14:00" note field with the record? Should the meal time appear in the history row (like clock time)? Should a second click on "start" be disallowed until the previous fast is complete?</p>
        </div>
      </div>`;
  } else if(name==='16:8'){
    p.innerHTML=`
      <div class="preview-label">Profile: 16:8 &mdash; 16-hour timer, locked, no adjustments</div>
      <div class="omad-block">
        <div class="omad-clock"><div><div class="time">16h</div><div class="label">fast · eating: 8h</div></div></div>
        <div class="omad-info">
          <p>Timer shows 16h fixed. No buttons between timer figures (no hour selectors). No text between buttons. Edit disabled. History row: pill <strong>16:8</strong>, clock-time start/end, duration, indicator dot.</p>
        </div>
      </div>`;
  } else if(name==='5:2'){
    p.innerHTML=`
      <div class="preview-label">Profile: 5:2 &mdash; calorie tracking, no timer</div>
      <div class="cal-row"><input type="number" value="500" aria-label="Calories"> <span class="cal-pill">500 cal</span></div>
      <div class="cal-row"><input type="number" value="250" aria-label="Calories"> <span class="cal-pill">750 / 500 &nbsp;total</span></div>
      <div class="info-box"><strong>Suggested intake (fasting day):</strong> 600 cal for men, 500 cal for women. Timer area replaced by running calorie sum (sum of user inputs against target). Green pill when under/at target, amber when exceeded.</div>`;
  } else {
    p.innerHTML=`
      <div class="preview-label">Profile: Custom &mdash; current behavior, first-run default</div>
      <div class="omad-info"><p>Hour selector visible. Start/Stop timer with adjustable length. Between-text visible. Default profile when user has not picked.</p></div>`;
  }
}
render('OMAD');
</script>
</body>
</html>
