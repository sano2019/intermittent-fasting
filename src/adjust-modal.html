<!-- Adjust start time modal — Option B, timer-section only -->
<div id="adjust-start-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:60; align-items:center; justify-content:center;">
  <div class="modal-inner card" style="padding:1.5rem; max-width:320px;">
    <h3 class="label" style="margin-top:0;">Adjust start time</h3>
    <p>Start: <input type="datetime-local" id="adjust-start-time" /></p>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button onclick="document.getElementById('adjust-start-modal').style.display='none';" class="btn">Cancel</button>
      <button onclick="const s=document.getElementById('adjust-start-time')?.value; if(s){ window.localStorage.setItem('timer-base', new Date(s).getTime().toString()); } document.getElementById('adjust-start-modal').style.display='none';" class="btn" style="background:var(--accent);">Save</button>
    </div>
  </div>
</div>
